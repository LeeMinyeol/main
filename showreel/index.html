<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Claude Showreel</title>
  <style>
    @font-face {
      font-family: 'Anton';
      src: url('/node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2') format('woff2');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Space Mono';
      src: url('/node_modules/@fontsource/space-mono/files/space-mono-latin-400-normal.woff2') format('woff2');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Space Mono';
      src: url('/node_modules/@fontsource/space-mono/files/space-mono-latin-700-normal.woff2') format('woff2');
      font-weight: 700;
    }
    html, body { margin: 0; background: #000; }
    canvas { display: block; width: 100vw; height: auto; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <script type="module">
    await Promise.all([
      document.fonts.load('100px Anton'),
      document.fonts.load('400 20px "Space Mono"'),
      document.fonts.load('700 20px "Space Mono"'),
    ]);
    const { renderFrame, TOTAL_FRAMES, FPS } = await import('./src/main.js');
    window.READY = true;

    // 주소 끝에 ?play 를 붙여 열면 브라우저에서 실시간 미리보기
    if (location.search.includes('play')) {
      const t0 = performance.now();
      const loop = () => {
        const f = Math.floor(((performance.now() - t0) / 1000) * FPS) % TOTAL_FRAMES;
        renderFrame(f, 1);
        requestAnimationFrame(loop);
      };
      loop();
    }
  </script>
</body>
</html>
